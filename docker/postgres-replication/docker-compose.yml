version: "3.8"

services:
  master:
    image: postgres:10
    container_name: postgres-master
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - ./data/master:/var/lib/postgresql/data
      - ./master/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - postgres-replication
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  replica1:
    image: postgres:10
    container_name: postgres-replica1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MASTER_SERVICE: master
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./data/replica1:/var/lib/postgresql/data
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    command: >
      postgres
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - postgres-replication
    depends_on:
      master:
        condition: service_healthy
    restart: on-failure

  replica2:
    image: postgres:10
    container_name: postgres-replica2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MASTER_SERVICE: master
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - ./data/replica2:/var/lib/postgresql/data
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    command: >
      postgres
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - postgres-replication
    depends_on:
      master:
        condition: service_healthy
    restart: on-failure

networks:
  postgres-replication:
    driver: bridge
